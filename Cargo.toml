[workspace]
resolver = "3"
members = [
    "crates/bevy_needle",
    "demo/univis_needle_demo",
]
# vendor/univis_ui 是带本地补丁的上游源码副本（自带 workspace 声明）
exclude = ["vendor/univis_ui"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.2.0"
license = "MIT OR Apache-2.0"
authors = ["qipking <qipking@users.noreply.github.com>"]
repository = "https://github.com/qipking/bevy_needle"

[workspace.dependencies]
# bevy 统一 0.19.1：rig-ecs 0.44 的 workspace 依赖是 bevy_ecs/bevy_app/bevy_tasks/
# bevy_reflect 0.19.1（精确版本段）。bevy 0.19.0 的 bevy_ecs 会与之分裂成两个
# 版本，World/Entity 类型不互通（升级计划 §2 第一刀）。0.19.1 是 patch 兼容发布。
bevy_app = "=0.19.1"
bevy_ecs = "=0.19.1"
bevy_tasks = "=0.19.1"
bevy = "=0.19.1"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Rig 0.44（registry pin；升级计划 §3.4：pin 明确版本 + Cargo.lock，本地源码为准）。
# rig-ecs 0.44.0 依赖 rig-core 0.44.0，两者同源同版；上游新版本统一升级。
rig-core = { version = "=0.44.0", default-features = false }
rig-ecs = { version = "=0.44.0", default-features = false }

# 本仓库内的三方引擎（从 cactus_needle wheel 解出，见 tools/extract_engine.py）
# libneedle3.so 位于 third_party/needle/3.0.1/

[profile.demo]
inherits = "release"
opt-level = 2
