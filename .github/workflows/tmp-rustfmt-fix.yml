name: tmp-rustfmt-fix

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency: fmt-fix

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: run rustfmt
        run: cargo fmt --all
      - uses: Swatinem/rust-cache@v2
      - name: verify fmt is now clean
        run: cargo fmt --all -- --check
      - name: commit & push if there are changes
        run: |
          if ! git diff --quiet; then
            git config user.name "fmt-bot"
            git config user.email "noreply@users.noreply.github.com"
            git add -A
            git commit -m "style: cargo fmt --all（CI rustfmt；§29.8 G-gate 前置）"
            git push origin master
          fi
