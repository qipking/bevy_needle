[package]
name = "bevy_needle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bevy ECS integration for the Needle tool-calling model: local instruction parsing and function calling with the 14 MB on-device needle2 engine. No Python, no cloud, no async runtime."
license.workspace = true
repository = "https://github.com/qipking/bevy_needle"
homepage = "https://github.com/qipking/bevy_needle"
documentation = "https://docs.rs/bevy_needle"
keywords = ["bevy", "ecs", "llm", "tool-calling", "gamedev"]
categories = ["game-development", "api-bindings"]
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[package.metadata.bevy_cli]
release = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_panics_doc = "warn"
# rig 0.44 契约面固定：宿主 handler 注册/收据函数的 `Result<_, ErrorReport>`
# 签名与事件枚举形状由上游契约给定，宿主侧不得为 lint 重构签名/装箱。
result_large_err = "allow"
large_enum_variant = "allow"

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
libloading = { version = "0.8", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"

# ── rig 实现层（`rig` feature；默认构建不编译不链接）─────────────────
# Rig 0.44：registry 发布版（升级计划 §3.2/§3.4——pin 明确版本 + Cargo.lock，
# 本地源码为准；v23 裁决删除 rig-run 前提、禁用旧 CompletionModel API）。
# 0.44 无 per-provider features（#2397 后 provider 拆出），default-features=false
# 只关 derive。rig-ecs 0.44 = "rig inside a Bevy World"（RigPlugin / bus /
# agent / policy），workspace 依赖 bevy_ecs 0.19.1——与 workspace bevy 统一。
rig-core = { workspace = true, optional = true }
rig-ecs = { workspace = true, optional = true }
# futures 只在 rig feature 下使用（rig-core 已引入同一依赖；单帧流的 Stream impl）。
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync"], optional = true }

[features]
default = ["dlopen"]
## Load the engine at runtime through `libloading` (the usual desktop flow).
dlopen = ["dep:libloading"]
## 升级能力层（PR-B，`src/escalate/`）：Driver 抽象 + Coordinator + 状态机，
## **无 rig 依赖**——可编译、可测（MockDriver 跑通升级链路）。
escalate = []
## rig 实现层（`src/rig/`）：Rig 0.44 adapter（Model/Wire/Transport →
## ModelAdapter → Serve）。registry 发布版，可直接 publish。
rig = ["escalate", "dep:rig-core", "dep:futures", "dep:tokio"]
## rig-ecs host 层（升级计划 §4.1）：RigPlugin 接线 + Handler 注册 +
## UsesModel/Grant（POC 闸门的 rig-ecs 交界）。依赖 rig。
rig-ecs = ["rig", "dep:rig-ecs"]

# ── 教学示例（按编号即学习顺序）────────────────────────────────
# 每个示例聚焦一个功能点，逐行注释，可独立运行：
#   cargo run -p bevy_needle --example 01_anatomy

[[example]]
name = "01_anatomy"
path = "examples/01_anatomy.rs"

[[example]]
name = "02_tools"
path = "examples/02_tools.rs"

[[example]]
name = "03_agents"
path = "examples/03_agents.rs"

[[example]]
name = "04_lifecycle"
path = "examples/04_lifecycle.rs"

[[example]]
name = "05_confidence"
path = "examples/05_confidence.rs"

[[example]]
name = "06_sessions"
path = "examples/06_sessions.rs"

[[example]]
name = "07_mock_backend"
path = "examples/07_mock_backend.rs"

[[example]]
name = "08_extraction"
path = "examples/08_extraction.rs"

[[example]]
name = "09_diagnostics"
path = "examples/09_diagnostics.rs"

[[example]]
name = "10_external_dispatch"
path = "examples/10_external_dispatch.rs"
