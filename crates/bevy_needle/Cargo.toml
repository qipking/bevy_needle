[package]
name = "bevy_needle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Bevy ECS integration for the Needle tool-calling model: local instruction parsing and function calling with the 14 MB on-device needle2 engine. No Python, no cloud, no async runtime."
license.workspace = true
repository = "https://github.com/bevy-needle/bevy_needle"
homepage = "https://github.com/bevy-needle/bevy_needle"
documentation = "https://docs.rs/bevy_needle"
keywords = ["bevy", "ecs", "llm", "tool-calling", "gamedev"]
categories = ["game-development", "api-bindings"]
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[package.metadata.bevy_cli]
release = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_panics_doc = "warn"

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
libloading = { version = "0.8", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"

[features]
default = ["dlopen"]
## Load the engine at runtime through `libloading` (the usual desktop flow).
dlopen = ["dep:libloading"]

